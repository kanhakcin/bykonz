services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"   # só localhost; Nginx expõe pra fora
    depends_on:
      - waha

  waha:
    image: devlikeapro/waha
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # painel/API do WAHA, só localhost
    volumes:
      - waha_sessions:/app/.sessions
    environment:
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WHATSAPP_DEFAULT_ENGINE=GOWS
volumes:
  waha_sessions:
